<!DOCTYPE html>

<html lang="en">
   <head>
      <meta charset="utf-8">
      <meta http-equiv=""X-UA-Compatible" content=""IE=edge">
      <title>The Boardroom Kailua Navbar</title>
      <meta name="description" content="IE=edge">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <!-- Bootstrap Icons -->
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
      <!-- Bootstrap CSS -->
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
       <!-- css file -->
       <link rel="stylesheet" href="style.css">


   </head>
   
   <body>
      <div class="container-fluid px-0 boardroom-top-bar">
        
        <nav class="navbar navbar-expand-lg bg-gradient">
            
            <div class="container d-flex justify-content-between align-items-center">

                <!-- instagram icon left-->
                 <ul class="nav justify-content-start">
                    <li class="nav-item">
                        <a class="navbar-brand text-white" href="#">
                            <i class="bi bi-instagram"></i>
                        </a>
                    </li>
                 </ul>

                <!-- boardroom logo center -->
                 <ul class="nav justify-content-center">
                    <li class="nav-item">
                        <a href="#">
                            <img src="./theboardroomlogo.png" alt="The Boardroom Logo" height="50">

                        </a>
                    </li>
                 </ul>

                 <!-- menu button right(end) -->
                  <ul class="nav justify-content-end">
                    <li class="nav-item">
                        <button class="btn btn-dark" type="button">Menu</button>
                    </li>
                  </ul>

                
                
            </div>
        </nav>
      </div>

   </body>

</html>
