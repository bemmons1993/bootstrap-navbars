<!DOCTYPE html>

<html lang="en">
   <head>
      <meta charset="utf-8">
      <meta http-equiv="X-UA-Compatible" content="IE=edge">
      <title>The Boardroom Kailua Navbar</title>
      <meta name="description" content="Navbar Assignment">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <!-- Bootstrap Icons -->
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
      <!-- Bootstrap CSS -->
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
       <!-- css file -->
       <link rel="stylesheet" href="style.css">
   </head>

   <body>
      <!-- 1. boardroom navbar -->
      <div class="container-fluid px-0 boardroom-top-bar">
        <nav class="navbar navbar-expand-lg bg-gradient">
            <div class="container d-flex justify-content-between align-items-center">

                <!-- instagram icon left-->
                 <ul class="nav justify-content-start">
                    <li class="nav-item">
                        <a class="navbar-brand text-white" href="#">
                            <i class="bi bi-instagram"></i>
                        </a>
                    </li>
                 </ul>

                <!-- boardroom logo center -->
                 <ul class="nav justify-content-center">
                    <li class="nav-item">
                        <a href="#">
                            <img src="./theboardroomlogo.png" alt="The Boardroom Logo" height="50">
                        </a>
                    </li>
                 </ul>

                 <!-- menu button right(end) -->
                  <ul class="nav justify-content-end">
                    <li class="nav-item">
                        <button class="btn btn-dark" type="button">Menu</button>
                    </li>
                  </ul>
            </div>
        </nav>
      </div>
      
      <!-- 2. morning brew nav  -->
      <div>
        <div class="navbar navbar-expand-lg bg-light">
          <div class="container py-2 position-relative">
            <div class="mx-auto navbar-nav">
              <img src="./morningbrewlogo.png" alt="Morning Brew Logo" height="50">
            </div>
            <div class="position-absolute end-0 top-50 translate-middle-y pe-3">
              <a href="#" class="cart-icon text-decoration-none">
                <i class="bi bi-bag-fill"></i>
                <span class="cart-count">0</span>
              </a>
            </div>
          </div>
        </div>

        <!-- menu -->
        <div class="navbar navbar-expand-lg bg-light sticky-top">
          <div class="container">
            <div class="mx-auto navbar-nav flex-row flex-wrap justify-content-center">
              <div class="nav-item border-1 border-top border-dark active border-3">Home</div>
              <div class="nav-item border-1 border-top border-dark">Order Online</div>
              <div class="nav-item border-1 border-top border-dark">Menus</div>
              <div class="nav-item border-1 border-top border-dark">Locations</div>
              <div class="nav-item border-1 border-top border-dark">About</div>
              <div class="nav-item border-1 border-top border-dark">Shop</div>
              <div class="nav-item border-1 border-top border-dark">Contact</div>
            </div>
          </div>
        </div>
      </div>
  

      <!-- 3. Buzz Navbar -->
       <div class="container-fluid px-0 buzzs-top-bar">
        <nav class="navbar navbar-expand-lg bg-gradient">
          <div class="container py-2 d-flex justify-content-between align-items-center flex-nowrap">

            <!-- left items -->
            <ul class="nav justify-content-start align-items-center mb-0 flex-nowrap">
              <li class="nav-item-buzz px-2"><h4>LUNCH</h4></li>
              <li class="nav-item-buzz px-2"><h4>DINNER</h4></li>
              <li class="nav-item-buzz px-2"><h4>DRINKS &amp; PUPU</h4></li>
            </ul>

            <!-- center items -->
            <ul class="nav justify-content-center align-items-center mb-0 flex-nowrap">
              <li class="nav-item-buzz">
                <a href="#">
                  <img src="./buzzlogo.png" alt="Buzz's Logo" height="50">
                </a>
              </li>
            </ul>

            <!-- right items -->
            <ul class="nav justify-content-end align-items-center mb-0 flex-nowrap">
              <li class="nav-item-buzz px-2"><h4>ABOUT</h4></li>
              <li class="nav-item-buzz px-2"><h4>LOCATION</h4></li>
              <li class="nav-item-buzz px-2"><h4>SHOP</h4></li>
              <li class="nav-item-buzz px-2">
                <h4><i class="bi bi-cart"></i></h4>
              </li>
            </ul>

          </div>
        </nav>
      </div>

      <!-- 4. Aloha Beer -->
       <nav class="navbar navbar-expand-lg navbar-light bg-light py-2">
        <div class="container d-flex justify-content-between align-items-center">

          <!-- left side aloha beer logo-->
          <a class="navbar-brand m-0" href="#">
            <img src="./alohabeerlogo.png" alt="Aloha Beer Logo" width="110">
          </a>

          <!-- center menu items -->
          <div class="nav justify-content-center">
            <a class="nav-link text-dark px-3" href="#">Locations &amp; Menus</a>
            <a class="nav-link text-dark px-3" href="#">Events</a>
            <a class="nav-link text-dark px-3" href="#">Brewery</a>
            <a class="nav-link px-3 aloha-shop" href="#">Shop</a>
          </div>

          <!-- right: account search cart -->
          <div class="nav justify-content-end align-items-center">
            <a class="nav-link text-dark px-2" href="#">Account</a>
            <a class="nav-link text-dark px-2" href="#">
              Search <i class="bi bi-search"></i>
            </a>
            <a class="nav-link text-dark px-2" href="#">
              Cart <i class="bi bi-cart3"></i>
            </a>
          </div>

        </div>
      </nav>
   </body>
</html>
